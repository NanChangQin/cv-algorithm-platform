services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cv-platform-prometheus:/prometheus
    ports:
      - "127.0.0.1:${CV_PLATFORM_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - default

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${CV_PLATFORM_GRAFANA_ADMIN_PASSWORD:?set CV_PLATFORM_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/monitoring/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/platform.yaml:ro
      - cv-platform-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${CV_PLATFORM_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - default

volumes:
  cv-platform-prometheus:
    name: cv-algorithm-platform-prometheus
  cv-platform-grafana:
    name: cv-algorithm-platform-grafana
