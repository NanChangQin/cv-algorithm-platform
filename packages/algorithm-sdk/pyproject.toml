[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cv-algorithm-sdk"
version = "0.1.0"
description = "Contracts and schemas for CV Algorithm Platform containers"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
server = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]
test = ["fastapi>=0.116,<1", "httpx>=0.28,<1", "pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/cv_algorithm_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
