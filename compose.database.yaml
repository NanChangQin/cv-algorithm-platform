services:
  postgres:
    image: postgres:17-alpine
    profiles: ["database"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CV_PLATFORM_POSTGRES_DB:-cv_platform}
      POSTGRES_USER: ${CV_PLATFORM_POSTGRES_USER:-cv_platform}
      POSTGRES_PASSWORD: ${CV_PLATFORM_POSTGRES_PASSWORD:?set CV_PLATFORM_POSTGRES_PASSWORD}
    volumes:
      - cv-platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default

  database-migrator:
    build:
      context: .
      dockerfile: infra/docker/database-migrator.Dockerfile
    image: cv-platform/database-migrator:dev
    profiles: ["database"]
    environment:
      CV_PLATFORM_POSTGRES_HOST: postgres
      CV_PLATFORM_POSTGRES_PORT: "5432"
      CV_PLATFORM_POSTGRES_DB: ${CV_PLATFORM_POSTGRES_DB:-cv_platform}
      CV_PLATFORM_POSTGRES_USER: ${CV_PLATFORM_POSTGRES_USER:-cv_platform}
      CV_PLATFORM_POSTGRES_PASSWORD: ${CV_PLATFORM_POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  backend:
    environment:
      CV_PLATFORM_PERSISTENCE_BACKEND: postgres
      CV_PLATFORM_QUEUE_BACKEND: postgres
      CV_PLATFORM_POSTGRES_HOST: postgres
      CV_PLATFORM_POSTGRES_PORT: "5432"
      CV_PLATFORM_POSTGRES_DB: ${CV_PLATFORM_POSTGRES_DB:-cv_platform}
      CV_PLATFORM_POSTGRES_USER: ${CV_PLATFORM_POSTGRES_USER:-cv_platform}
      CV_PLATFORM_POSTGRES_PASSWORD: ${CV_PLATFORM_POSTGRES_PASSWORD}
    depends_on:
      database-migrator:
        condition: service_completed_successfully

  worker:
    image: cv-platform/backend:dev
    restart: unless-stopped
    command: ["python", "-m", "cv_platform.worker"]
    healthcheck:
      disable: true
    environment:
      CV_PLATFORM_PERSISTENCE_BACKEND: postgres
      CV_PLATFORM_QUEUE_BACKEND: postgres
      CV_PLATFORM_POSTGRES_HOST: postgres
      CV_PLATFORM_POSTGRES_PORT: "5432"
      CV_PLATFORM_POSTGRES_DB: ${CV_PLATFORM_POSTGRES_DB:-cv_platform}
      CV_PLATFORM_POSTGRES_USER: ${CV_PLATFORM_POSTGRES_USER:-cv_platform}
      CV_PLATFORM_POSTGRES_PASSWORD: ${CV_PLATFORM_POSTGRES_PASSWORD}
      CV_PLATFORM_ALGORITHM_MANAGER_URL: http://algorithm-manager:8010/api/v1
      CV_PLATFORM_MANAGER_API_TOKEN: ${CV_PLATFORM_MANAGER_API_TOKEN:-}
      CV_PLATFORM_MEDIA_WORKER_URL: http://media-worker:8020
      CV_PLATFORM_STORAGE_ROOT: /storage
      CV_PLATFORM_PACKAGE_ROOT: /packages
      CV_PLATFORM_TASK_WORKER_COUNT: ${CV_PLATFORM_TASK_WORKER_COUNT:-2}
    volumes:
      - ${CV_PLATFORM_DATA_ROOT:-/srv/cv-platform/data}:/storage
      - ${CV_PLATFORM_PACKAGE_ROOT:-/srv/cv-platform/packages}:/packages
    depends_on:
      database-migrator:
        condition: service_completed_successfully
      algorithm-manager:
        condition: service_healthy
      media-worker:
        condition: service_healthy
    networks:
      - default
      - algorithm-runtime

volumes:
  cv-platform-postgres:
    name: cv-algorithm-platform-postgres
