name: cv-algorithm-platform

services:
  algorithm-manager:
    build:
      context: .
      dockerfile: infra/docker/algorithm-manager.Dockerfile
    image: cv-platform/algorithm-manager:dev
    restart: unless-stopped
    environment:
      ALGORITHM_MANAGER_DOCKER_NETWORK: cv-algorithm-platform_algorithm-runtime
      ALGORITHM_MANAGER_HOST_DATA_ROOT: ${CV_PLATFORM_DATA_ROOT:-/srv/cv-platform/data}
      ALGORITHM_MANAGER_HOST_MODEL_ROOT: ${CV_PLATFORM_MODEL_ROOT:-/srv/cv-platform/models}
      ALGORITHM_MANAGER_PACKAGE_ROOT: /packages
      ALGORITHM_MANAGER_BUILD_NETWORK: ${CV_PLATFORM_BUILD_NETWORK:-bridge}
      ALGORITHM_MANAGER_API_TOKEN: ${CV_PLATFORM_MANAGER_API_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CV_PLATFORM_PACKAGE_ROOT:-/srv/cv-platform/packages}:/packages
      - ${CV_PLATFORM_DATA_ROOT:-/srv/cv-platform/data}:/data
    networks:
      - default
      - algorithm-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    image: cv-platform/backend:dev
    restart: unless-stopped
    environment:
      CV_PLATFORM_DEBUG: "false"
      CV_PLATFORM_CORS_ORIGINS: '["http://localhost:8080"]'
      CV_PLATFORM_ALGORITHM_MANAGER_URL: http://algorithm-manager:8010/api/v1
      CV_PLATFORM_MANAGER_API_TOKEN: ${CV_PLATFORM_MANAGER_API_TOKEN:-}
      CV_PLATFORM_STORAGE_ROOT: /storage
      CV_PLATFORM_PACKAGE_ROOT: /packages
      CV_PLATFORM_ADMIN_USERNAME: ${CV_PLATFORM_ADMIN_USERNAME:-admin}
      CV_PLATFORM_ADMIN_PASSWORD: ${CV_PLATFORM_ADMIN_PASSWORD:?set CV_PLATFORM_ADMIN_PASSWORD}
      CV_PLATFORM_AUTH_ENABLED: ${CV_PLATFORM_AUTH_ENABLED:-false}
      CV_PLATFORM_SECURE_COOKIES: ${CV_PLATFORM_SECURE_COOKIES:-false}
      CV_PLATFORM_MEDIA_WORKER_URL: http://media-worker:8020
    depends_on:
      algorithm-manager:
        condition: service_healthy
      media-worker:
        condition: service_healthy
    volumes:
      - ${CV_PLATFORM_DATA_ROOT:-/srv/cv-platform/data}:/storage
      - ${CV_PLATFORM_PACKAGE_ROOT:-/srv/cv-platform/packages}:/packages
    networks:
      - default
      - algorithm-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  media-worker:
    build:
      context: .
      dockerfile: infra/docker/media-worker.Dockerfile
    image: cv-platform/media-worker:dev
    restart: unless-stopped
    volumes:
      - ${CV_PLATFORM_DATA_ROOT:-/srv/cv-platform/data}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  faster-rcnn:
    profiles: ["algorithm-images"]
    build:
      context: .
      dockerfile: examples/faster-rcnn/Dockerfile
    image: cv-platform/faster-rcnn:dev

  yolo:
    profiles: ["algorithm-images"]
    build:
      context: .
      dockerfile: examples/yolo/Dockerfile
    image: cv-platform/yolo:dev

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    image: cv-platform/frontend:dev
    restart: unless-stopped
    ports:
      - "${CV_PLATFORM_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  algorithm-runtime:
    internal: true
    name: cv-algorithm-platform_algorithm-runtime
