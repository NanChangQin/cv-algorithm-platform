name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # 类型检查 + 生产构建；从干净的检出构建，能发现漏提交的文件
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/algorithm-sdk "./backend[dev]" "./services/algorithm-manager[dev]"
      - name: Algorithm SDK
        working-directory: packages/algorithm-sdk
        run: python -m pytest -q
      - name: Backend
        working-directory: backend
        run: python -m pytest -q
      - name: Algorithm Manager
        working-directory: services/algorithm-manager
        run: PYTHONPATH=src python -m pytest -q
      - name: Cross-service contracts
        run: python -m pytest -q tests
