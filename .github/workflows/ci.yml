name: CI

on:
  push:
    branches: [main]
  pull_request:

# 固定 24.04：ubuntu-latest 正在迁移到 26.04，避免运行环境和预编译 Python 悄悄变化
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # 类型检查 + 生产构建；从干净的检出构建，能发现漏提交的文件
      - run: npm run build

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/algorithm-sdk "./backend[dev]" "./services/algorithm-manager[dev]"
      - name: Algorithm SDK
        working-directory: packages/algorithm-sdk
        run: python -m pytest -q
      - name: Backend
        working-directory: backend
        run: python -m pytest -q
      - name: Algorithm Manager
        working-directory: services/algorithm-manager
        run: PYTHONPATH=src python -m pytest -q
      - name: Cross-service contracts
        run: python -m pytest -q tests
