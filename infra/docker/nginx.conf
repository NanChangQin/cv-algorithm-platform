server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2g;

    # 脚本、样式和接口 JSON 压缩传输；图片和事件流不压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/v1/task-events/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        # 与 /api/ 一致覆盖转发头，否则客户端自带的 X-Forwarded-For 会被 uvicorn 当成来源 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 训练数据集 ZIP 可能有数 GB：放宽大小限制，边收边转发，不先落盘到 nginx
    location = /api/v1/training/datasets {
        client_max_body_size 10g;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加，防止客户端自带 X-Forwarded-For 伪造来源 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # The SPA route /assets conflicts with Vite's compiled /assets directory.
    location = /assets {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Vite 产物文件名带内容哈希，内容变了文件名就变，可以长期缓存
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口页每次都向服务器确认，发版后用户立刻拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
